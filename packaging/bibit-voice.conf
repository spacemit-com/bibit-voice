# Bibit voice service: global single-instance Unix socket directory.
# The audio/tool sockets live at /run/bibit/{audio,tool}.sock and are created
# by bibit-audio / bibit-voice-tool (bianbu user) at runtime. The directory is
# owned by bianbu and 0700; each socket file is additionally chmod 0600.
d /run/bibit 0700 bianbu bianbu - -
