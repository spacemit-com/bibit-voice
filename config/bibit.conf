model_root=/opt/bibit/models
provider_config=/etc/bibit/bibit-asr-provider.config
# Default ASR is Qwen3-ASR 0.6B: a generative model served by llama-server on
# 127.0.0.1:8063. The five keys below move together - switching only
# asr_model_type leaves llama-server loading the other model's file, and it
# then fails after the startup timeout. `set_asr_model` rewrites and persists
# all five, still without restarting the service. For reference, the
# SenseVoice set is: sensevoice / model_quant_optimized.onnx /
# tokens.sherpa.txt / spacemit / greedy_search.
asr_model_type=qwen3_asr_0.6b
asr_model=/opt/bibit/models/asr/qwen3-asr-0.6B-dynq-q40/Qwen3-ASR-0.6B-text-q40.gguf
asr_tokens=
asr_provider=smt
asr_num_threads=2
asr_decoding_method=generative
asr_max_active_paths=4
asr_pre_roll_ms=180
asr_post_roll_ms=120
qwen3_model_dir=/opt/bibit/models/asr/qwen3-asr-0.6B-dynq-q40
qwen3_server_bin=llama-server
qwen3_server_host=127.0.0.1
qwen3_server_port=8063
qwen3_thread_batch=2
qwen3_ep_affinity=8;9
qwen3_ctx_size=4096
qwen3_language=zh,en
qwen3_max_tokens=100
qwen3_startup_timeout_ms=60000
qwen3_request_timeout_ms=60000
keywords_file=/etc/bibit/keywords.txt
kws_fallback_keywords_file=/etc/bibit/keywords-fallback.txt
# Use the system default input and follow later changes made in sound settings.
audio_source=default
input_rate=16000
input_channels=2
# Capture-queue ceiling in milliseconds. The queue absorbs jitter only: at the
# old 30 s a single stall pinned the pipeline 30 s behind live audio and it
# never recovered, because the worker can only catch up by running faster than
# realtime. Anything past this ceiling is dropped oldest-first and triggers an
# audio_discontinuity reset of the KWS/VAD state.
audio_queue_max_ms=2000
wake_enabled=true
asr_enabled=true
kws_score=4.5
kws_threshold=0.12
kws_trailing_blanks=1
kws_max_token_gap_ms=600
kws_fallback_score=4.0
kws_fallback_threshold=0.15
kws_fallback_max_duration_ms=1100
# A fallback hit is confirmed by the loaded ASR before waking (SenseVoice, or
# Qwen3-ASR when it is the selected model). Primary Hello Bibit remains
# one-stage and has no added latency.
kws_fallback_verify_enabled=true
kws_fallback_verify_pre_roll_ms=240
kws_fallback_verify_max_audio_ms=1600
kws_long_candidate_ms=900
kws_long_candidate_max_rms_ratio=1.0
kws_parallel_continuous_max_rms_ratio=5.0
kws_onset_window_ms=3000
kws_reset_on_speech_after_silence=true
kws_silence_reset_ms=1200
# Also the absolute energy floor for accepting a KWS candidate: a candidate
# quieter than this is rejected however clean its token timing looks.
kws_speech_rms_threshold=0.0015
# History re-fed to the rebuilt onset streams when speech follows silence. 800
# re-decodes both onset streams and costs more than the worker has left, which
# is what filled the capture queue; 0 keeps the reset and skips the re-decode.
# The measured A/B/C comparison is in docs/configuration.md.
kws_reset_pre_roll_ms=0
kws_max_active_paths=16
kws_chunk_size=16
# KWS Debug is off in normal use. Enable it in the Qt 参数 panel to retain
# the pre-trigger audio and diagnostic JSON for each accepted wake.
kws_debug_enabled=false
# Unset: the service derives this from $XDG_STATE_HOME/bibit/kws-debug, or
# $HOME/.local/share/bibit/kws-debug when XDG_STATE_HOME is not set.
kws_debug_pre_roll_ms=4000
kws_debug_max_files=200
vad_threshold=0.30
min_silence=0.50
min_speech=0.20
max_speech=12.0
vad_log_interval_ms=500
wake_guard_ms=180
wake_ack_enabled=true
wake_ack_file=/usr/share/bibit/sounds/wo-zai.wav
wake_ack_post_delay_ms=0
followup_enabled=true
followup_timeout=6.0
